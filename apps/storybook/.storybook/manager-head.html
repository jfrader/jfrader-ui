<!-- Static metadata for the manager document (build and dev). Storybook inserts this verbatim into
index.html and already emits the document title, so do not add one here. -->
<meta
  name="description"
  content="Accessible React components for dark and light interfaces, themed with CSS custom properties. Live Storybook at ui.jfrader.com."
/>
<!-- Mirrors --ui-color-bg so the browser chrome matches the dark canvas. -->
<meta name="theme-color" content="#08090a" />
<link rel="canonical" href="https://ui.jfrader.com/" />
<!-- Named distinctly from Storybook's own favicon.svg so the build assets never collide. -->
<link rel="icon" type="image/svg+xml" href="./jfrader-favicon.svg" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="jfrader ui" />
<meta property="og:title" content="jfrader ui — React component system" />
<meta
  property="og:description"
  content="Accessible React components for dark and light interfaces, themed with CSS custom properties. Browse the live Storybook."
/>
<meta property="og:url" content="https://ui.jfrader.com/" />
<meta property="og:image" content="https://ui.jfrader.com/og-image.png" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta
  property="og:image:alt"
  content="Dark card preview: a project name field with axe clean and WCAG AA pills, and Cancel / Create project buttons."
/>

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="jfrader ui — React component system" />
<meta
  name="twitter:description"
  content="Accessible React components for dark and light interfaces, themed with CSS custom properties. Browse the live Storybook."
/>
<meta name="twitter:image" content="https://ui.jfrader.com/og-image.png" />
<meta
  name="twitter:image:alt"
  content="Dark card preview: a project name field with axe clean and WCAG AA pills, and Cancel / Create project buttons."
/>
