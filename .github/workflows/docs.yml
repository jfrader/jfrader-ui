name: Docs

# Builds apps/docs (the jfrader/ui documentation front) and publishes it to ui.jfrader.com.
# The engine lives in its own public repo and is checked out beside this one, because the docs app
# links it rather than installing it: `link:../../../../storybook-docs` resolves to <workspace>/storybook-docs.
on:
  push:
    branches: [master]
    paths: ['apps/docs/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['apps/docs/**', '.github/workflows/docs.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the library
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: jfrader-ui
          persist-credentials: false

      # Pinned so a deploy is reproducible; bump this when the engine ships something the docs need.
      - name: Check out the docs engine
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jfrader/storybook-docs
          ref: ab1787eaba55ef7fea08c0aeffcad85fe8aad6ec
          path: storybook-docs
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      # The engine is consumed from source, so its own dependencies must be installed next to it.
      - name: Install the engine
        run: pnpm install --frozen-lockfile --prefer-offline
        working-directory: storybook-docs

      - name: Install the library
        run: pnpm install --frozen-lockfile --prefer-offline
        working-directory: jfrader-ui

      # apps/docs reads the library's generated token CSS; it is gitignored, so generate it here.
      - name: Generate tokens
        run: pnpm --filter @jfrader/tokens generate
        working-directory: jfrader-ui

      - name: Build the docs site
        run: pnpm build
        working-directory: jfrader-ui/apps/docs

      - name: Upload the site
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: jfrader-ui/apps/docs/dist

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
