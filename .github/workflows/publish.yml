name: Publish packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  pack:
    if: github.repository == 'jfrader/jfrader-ui'
    runs-on: ubuntu-24.04
    # Checks and the full monorepo build took ~19 minutes; leave room for install and packing.
    timeout-minutes: 45
    outputs:
      tokens: ${{ steps.pack.outputs.tokens }}
      styling: ${{ steps.pack.outputs.styling }}
      icons: ${{ steps.pack.outputs.icons }}
      ui: ${{ steps.pack.outputs.ui }}

    steps:
      - name: Check out release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up npmjs
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false

      - name: Install release npm
        run: npm install --global npm@11.18.0

      - name: Verify release identity
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const expected = { tokens: '@jfrader/tokens', styling: '@jfrader/styling', icons: '@jfrader/icons', ui: '@jfrader/ui' };
          for (const [dir, name] of Object.entries(expected)) {
            const manifest = JSON.parse(readFileSync(`packages/${dir}/package.json`, 'utf8'));
            if (manifest.name !== name) throw new Error(`Unexpected package name in packages/${dir}`);
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(manifest.version)) {
              throw new Error(`Only stable versions may be published to latest: ${name}`);
            }
            if (process.env.GITHUB_REF_NAME !== `v${manifest.version}`) throw new Error(`Tag/version mismatch for ${name}`);
          }
          NODE
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @jfrader/storybook exec playwright install --with-deps chromium

      - name: Check release
        run: |
          pnpm typecheck
          pnpm test
          pnpm verify:exports
          pnpm verify:icons
          git diff --exit-code -- packages/tokens/src/generated
          git diff --exit-code -- packages/icons/src/generated packages/icons/icons.json

      - name: Build packages
        run: |
          pnpm --filter @jfrader/tokens build
          pnpm --filter @jfrader/styling build
          pnpm --filter @jfrader/icons build
          pnpm --filter @jfrader/ui build

      # pnpm pack, not npm pack: it rewrites `workspace:*` to the released version in the packed manifest.
      - name: Pack once
        id: pack
        env:
          npm_config_ignore_scripts: "true"
        run: |
          trap 'node scripts/flip-exports.mjs src' EXIT
          node scripts/flip-exports.mjs dist
          mkdir -p "$RUNNER_TEMP/release"
          for package in tokens styling icons ui; do
            (cd "packages/$package" && pnpm pack --json --pack-destination "$RUNNER_TEMP/release") > "$RUNNER_TEMP/pack-$package.json"
          done
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          for (const dir of ['tokens', 'styling', 'icons', 'ui']) {
            const packed = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, `pack-${dir}.json`), 'utf8'));
            const manifest = JSON.parse(readFileSync(`packages/${dir}/package.json`, 'utf8'));
            if (packed.name !== manifest.name || packed.version !== manifest.version) {
              throw new Error(`Packed artifact identity mismatch for ${manifest.name}`);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `${dir}=${path.basename(packed.filename)}\n`);
          }
          NODE

      - name: Upload release tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarballs
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release/${{ steps.pack.outputs.tokens }}
            ${{ runner.temp }}/release/${{ steps.pack.outputs.styling }}
            ${{ runner.temp }}/release/${{ steps.pack.outputs.icons }}
            ${{ runner.temp }}/release/${{ steps.pack.outputs.ui }}

  publish-npmjs:
    needs: pack
    runs-on: ubuntu-24.04
    # Four npm publish calls plus integrity polling (up to 7.5 minutes per package) against one registry.
    timeout-minutes: 40
    steps:
      - name: Check out release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up npmjs
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install release npm
        run: npm install --global npm@11.18.0

      - name: Download release tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/release

      # Publish dependencies first: tokens → styling → icons → ui.
      # npmjs authenticates through each package's trusted publisher (OIDC) for this workflow; no token.
      - name: Publish to npmjs (registry.npmjs.org)
        run: |
          node scripts/publish-registry.mjs "$RUNNER_TEMP/release/${{ needs.pack.outputs.tokens }}" https://registry.npmjs.org packages/tokens/package.json
          node scripts/publish-registry.mjs "$RUNNER_TEMP/release/${{ needs.pack.outputs.styling }}" https://registry.npmjs.org packages/styling/package.json
          node scripts/publish-registry.mjs "$RUNNER_TEMP/release/${{ needs.pack.outputs.icons }}" https://registry.npmjs.org packages/icons/package.json
          node scripts/publish-registry.mjs "$RUNNER_TEMP/release/${{ needs.pack.outputs.ui }}" https://registry.npmjs.org packages/ui/package.json

  publish-github-packages:
    needs: pack
    runs-on: ubuntu-24.04
    # Four npm publish calls plus integrity polling (up to 7.5 minutes per package) against one registry.
    timeout-minutes: 40
    steps:
      - name: Check out release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up GitHub Packages
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@jfrader"
          package-manager-cache: false

      - name: Install release npm
        run: npm install --global npm@11.18.0

      - name: Download release tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/release

      # Publish dependencies first: tokens → styling → icons → ui.
      - name: Publish to GitHub Packages (npm.pkg.github.com)
        run: |
          node scripts/publish-registry.mjs "$RUNNER_TEMP/release/${{ needs.pack.outputs.tokens }}" https://npm.pkg.github.com packages/tokens/package.json
          node scripts/publish-registry.mjs "$RUNNER_TEMP/release/${{ needs.pack.outputs.styling }}" https://npm.pkg.github.com packages/styling/package.json
          node scripts/publish-registry.mjs "$RUNNER_TEMP/release/${{ needs.pack.outputs.icons }}" https://npm.pkg.github.com packages/icons/package.json
          node scripts/publish-registry.mjs "$RUNNER_TEMP/release/${{ needs.pack.outputs.ui }}" https://npm.pkg.github.com packages/ui/package.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  report-release-visibility:
    needs: [publish-npmjs, publish-github-packages]
    if: always() && github.repository == 'jfrader/jfrader-ui'
    runs-on: ubuntu-24.04
    # Only checkout, Node setup, and eight bounded registry visibility requests; no install or build.
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Check out release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false

      - name: Report release visibility at both registries
        env:
          NPMJS_OUTCOME: ${{ needs.publish-npmjs.result }}
          GITHUB_PACKAGES_OUTCOME: ${{ needs.publish-github-packages.result }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/report-release-visibility.mjs
