name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jfrader/storybook exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:exports
      - run: pnpm verify:slots
      - run: pnpm build
      - run: pnpm --filter @jfrader/tokens build
      - run: pnpm --filter @jfrader/ui build
      - run: pnpm --filter @jfrader/storybook verify:docs:layout
