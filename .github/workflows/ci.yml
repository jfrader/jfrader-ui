name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jfrader/storybook exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
        id: tests
        env:
          VITE_DATE_REEL_DIAGNOSTICS: '1'
      - name: Retain browser test diagnostics
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/storybook/.vitest/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - run: pnpm verify:exports
      - run: pnpm verify:slots
      - run: pnpm verify:icons
      - run: pnpm verify:api
      - run: pnpm verify:docs
      - run: node scripts/release-tooling.test.mjs
      - run: pnpm build
      - run: pnpm --filter @jfrader/storybook test:browser
      - run: pnpm --filter @jfrader/tokens build
      - run: pnpm --filter @jfrader/styling build
      - run: pnpm --filter @jfrader/icons build
      - run: pnpm --filter @jfrader/ui build
      - run: pnpm --filter @jfrader/storybook verify:docs:layout
